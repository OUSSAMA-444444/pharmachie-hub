name: PharmaCheck checks and Streamlit deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test the Streamlit application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PharmaCheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PharmaCheck/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python files
        run: python -m compileall -q app.py analysis_history.py ui_backend.py pharmacheck_utils.py
      - name: Test models, navigation, predictions, history, deletion and recovery
        run: python -m unittest discover -s tests -v

  verify-deployment:
    name: Verify the Streamlit Community Cloud deployment
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STREAMLIT_URL: ${{ vars.STREAMLIT_APP_URL || 'https://pharmachie-app-33wuv5wcwhaxuj9ylmp2lz.streamlit.app' }}
    steps:
      - name: Wait for the connected Streamlit app to become healthy
        shell: python
        run: |
          import os
          import time
          import urllib.request

          base = os.environ['STREAMLIT_URL'].rstrip('/')
          deadline = time.monotonic() + 600
          last_error = None
          while time.monotonic() < deadline:
              try:
                  for path in ('/', '/~/+/_stcore/health'):
                      request = urllib.request.Request(base + path, headers={'User-Agent': 'PharmaCheck-GitHub-Actions'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          content = response.read(1024).decode('utf-8', errors='replace')
                          if response.status != 200:
                              raise RuntimeError(f'{path}: HTTP {response.status}')
                          if path.endswith('health') and content.strip() != 'ok':
                              raise RuntimeError('Streamlit is not healthy yet')
                  print(f'Streamlit is healthy: {base}')
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write(f'### PharmaCheck\n\n[Open the public app]({base})\n\n')
                      summary.write('All application tests passed. Streamlit Community Cloud deploys the connected main branch automatically; this job verifies availability.\n')
                  break
              except Exception as error:
                  message = str(error)
                  if message != last_error:
                      print(f'Waiting for Streamlit: {message}', flush=True)
                      last_error = message
                  time.sleep(10)
          else:
              raise SystemExit('Streamlit did not become healthy. Check the Community Cloud build logs and the connected repository, main branch and PharmaCheck/app.py entrypoint.')
